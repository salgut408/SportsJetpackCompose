[versions]
agp                 = "8.9.3"

kotlin              = "2.1.20"
ksp                 = "2.1.20-1.0.32"
composeBom          = "2025.04.01"
coreKtx             = "1.16.0"
lifecycle           = "2.8.7"
activityCompose     = "1.10.1"
navigation          = "2.8.9"
hilt                = "2.55"
hiltNavigation      = "1.2.0"
room                = "2.6.1"
coroutines          = "1.9.0"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
gson                = "2.11.0"
kotlinxSerialization = "1.7.3"
retrofitKotlinxSerializer = "1.0.0"
coil                = "3.1.0"
media3              = "1.6.0"
firebaseBom         = "33.10.0"
googleServices      = "4.4.2"
crashlyticsPlugin   = "3.0.2"
perfPlugin          = "1.4.2"
palette             = "1.0.0"
constraintlayout    = "1.1.0"
timber              = "5.0.1"
playServicesLocation = "21.3.0"
truth               = "1.4.5"
junitVersion        = "1.3.0"
espresso            = "3.7.0"

[libraries]
# Core
core-ktx                        = { group = "androidx.core",            name = "core-ktx",                      version.ref = "coreKtx" }
lifecycle-runtime               = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
lifecycle-viewmodel             = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-ktx",        version.ref = "lifecycle" }
lifecycle-viewmodel-compose     = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
activity-compose                = { group = "androidx.activity",         name = "activity-compose",               version.ref = "activityCompose" }

# Compose BOM — individual deps intentionally have no version (BOM controls it)
compose-bom                     = { group = "androidx.compose",          name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",       name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3",name = "material3" }
compose-material3-windowsize    = { group = "androidx.compose.material3",name = "material3-window-size-class" }
compose-material                = { group = "androidx.compose.material", name = "material" }
compose-ui-tooling              = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-test-manifest        = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
compose-ui-test-junit4          = { group = "androidx.compose.ui",       name = "ui-test-junit4" }

# Navigation
navigation-compose              = { group = "androidx.navigation",       name = "navigation-compose",             version.ref = "navigation" }

# Hilt
hilt-android                    = { group = "com.google.dagger",         name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",         name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",             name = "hilt-navigation-compose",       version.ref = "hiltNavigation" }

# Room
room-runtime                    = { group = "androidx.room",             name = "room-runtime",                  version.ref = "room" }
room-compiler                   = { group = "androidx.room",             name = "room-compiler",                 version.ref = "room" }
room-ktx                        = { group = "androidx.room",             name = "room-ktx",                      version.ref = "room" }

# Coroutines
coroutines-core                 = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",       version.ref = "coroutines" }
coroutines-android              = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

# Network
retrofit                        = { group = "com.squareup.retrofit2",    name = "retrofit",                      version.ref = "retrofit" }
retrofit-gson                   = { group = "com.squareup.retrofit2",    name = "converter-gson",                version.ref = "retrofit" }
okhttp-logging                  = { group = "com.squareup.okhttp3",      name = "logging-interceptor",           version.ref = "okhttp" }
gson                            = { group = "com.google.code.gson",      name = "gson",                          version.ref = "gson" }
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",    version.ref = "kotlinxSerialization" }
retrofit-kotlinx-serialization  = { group = "com.jakewharton.retrofit",  name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializer" }

# Image loading (Coil 3 — group changed from io.coil-kt to io.coil-kt.coil3)
coil-compose                    = { group = "io.coil-kt.coil3",          name = "coil-compose",                  version.ref = "coil" }
coil-network-okhttp             = { group = "io.coil-kt.coil3",          name = "coil-network-okhttp",           version.ref = "coil" }

# Media3
media3-exoplayer                = { group = "androidx.media3",           name = "media3-exoplayer",              version.ref = "media3" }
media3-ui                       = { group = "androidx.media3",           name = "media3-ui",                     version.ref = "media3" }

# Firebase BOM — child deps have no version (BOM controls it)
firebase-bom                    = { group = "com.google.firebase",       name = "firebase-bom",                  version.ref = "firebaseBom" }
firebase-crashlytics            = { group = "com.google.firebase",       name = "firebase-crashlytics-ktx" }
firebase-analytics              = { group = "com.google.firebase",       name = "firebase-analytics-ktx" }
firebase-firestore              = { group = "com.google.firebase",       name = "firebase-firestore-ktx" }
firebase-perf                   = { group = "com.google.firebase",       name = "firebase-perf-ktx" }
firebase-auth                   = { group = "com.google.firebase",       name = "firebase-auth-ktx" }

# UI extras
palette                         = { group = "androidx.palette",          name = "palette",                       version.ref = "palette" }
constraintlayout-compose        = { group = "androidx.constraintlayout", name = "constraintlayout-compose",      version.ref = "constraintlayout" }
lifecycle-runtime-compose       = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }

# Utilities
timber                          = { group = "com.jakewharton.timber",    name = "timber",                        version.ref = "timber" }
play-services-location          = { group = "com.google.android.gms",   name = "play-services-location",        version.ref = "playServicesLocation" }


# Testing
junit                           = { group = "junit",                     name = "junit",                         version = "4.13.2" }
androidx-junit                  = { group = "androidx.test.ext",         name = "junit",                         version.ref = "junitVersion" }
espresso-core                   = { group = "androidx.test.espresso",    name = "espresso-core",                 version.ref = "espresso" }
truth                           = { group = "com.google.truth",          name = "truth",                         version.ref = "truth" }

[plugins]
android-application             = { id = "com.android.application",                    version.ref = "agp" }
android-library                 = { id = "com.android.library",                        version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
ksp                             = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
hilt                            = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
google-services                 = { id = "com.google.gms.google-services",             version.ref = "googleServices" }
firebase-crashlytics            = { id = "com.google.firebase.crashlytics",            version.ref = "crashlyticsPlugin" }
firebase-perf                   = { id = "com.google.firebase.firebase-perf",          version.ref = "perfPlugin" }