plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)      // Kotlin 2.0+: compose compiler is now part of Kotlin
    alias(libs.plugins.ksp)                 // replaces kapt
    alias(libs.plugins.hilt)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
    alias(libs.plugins.firebase.perf)
}

android {
    namespace 'com.sgut.android.nationalfootballleague'
    compileSdk 35

    defaultConfig {
        applicationId "com.sgut.android.nationalfootballleague"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
    // composeOptions removed — Kotlin 2.0 + kotlin.plugin.compose handles this automatically

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core
    implementation libs.core.ktx
    implementation libs.lifecycle.runtime
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.activity.compose

    // Compose BOM
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material3.windowsize
    implementation libs.compose.material

    // Navigation
    implementation libs.navigation.compose

    // Hilt (KSP replaces kapt)
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    // Room (KSP replaces kapt)
    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    // Coroutines
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    // Network
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging
    implementation libs.gson

    // Image loading (Coil 3)
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    // Media3 / ExoPlayer
    implementation libs.media3.exoplayer
    implementation libs.media3.ui

    // Firebase BOM
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.crashlytics
    implementation libs.firebase.analytics
    implementation libs.firebase.firestore
    implementation libs.firebase.perf
    implementation libs.firebase.auth

    // UI extras
    implementation libs.constraintlayout.compose

    // Utilities
    implementation libs.timber
    implementation libs.play.services.location


    // Testing
    testImplementation libs.junit
    testImplementation libs.truth
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest
}